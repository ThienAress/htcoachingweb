[build]
  base = "client"
  command = "npm run build:netlify"
  publish = "dist"
  environment = { NODE_VERSION = "22.23.1" }

# Bản production cũng phục vụ ở htcoachingweb.netlify.app: chuyển hẳn về domain chính
# để Google không thấy hai site trùng nội dung. Chỉ khớp host này; staging--*.netlify.app
# không bị ảnh hưởng.
[[redirects]]
  from = "https://htcoachingweb.netlify.app/*"
  to = "https://htcoachingweb.io.vn/:splat"
  status = 301
  force = true

[context.staging]
  ignore = "exit 1"

[context.staging.environment]
  NODE_VERSION = "22.23.1"
  VITE_TODAY_PLATFORM_ENABLED = "true"
  VITE_API_URL = "https://htcoachingweb-staging.onrender.com/api"
  REQUIRE_DYNAMIC_ROUTES = "true"
  SITEMAP_API_URL = "https://htcoachingweb-staging.onrender.com/api"
  PRERENDER_API_URL = "https://htcoachingweb-staging.onrender.com/api"
  PRERENDER_CONCURRENCY = "8"

[context.production.environment]
  VITE_TODAY_PLATFORM_ENABLED = "true"
  VITE_GA4_MEASUREMENT_ID = "G-S7JEFVLP6G"
  VITE_GA4_HOSTNAME = "htcoachingweb.io.vn"
