<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Không tìm thấy trang | HTCOACHING</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #f4f4f5; }
      main { width: min(34rem, calc(100% - 2rem)); text-align: center; }
      strong { display: block; color: #34d399; font-size: clamp(4rem, 18vw, 8rem); line-height: 1; }
      h1 { margin: 1rem 0 .5rem; font-size: 1.5rem; }
      p { color: #a1a1aa; line-height: 1.7; }
      a { display: inline-block; margin-top: 1rem; border-radius: .75rem; background: #10b981; color: #052e16; padding: .8rem 1.1rem; font-weight: 700; text-decoration: none; }
      a:hover { background: #34d399; }
      a:focus-visible { outline: 3px solid #a7f3d0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <strong aria-hidden="true">404</strong>
      <h1>Không tìm thấy trang</h1>
      <p>Địa chỉ này không tồn tại, đã được đổi tên hoặc đã bị xóa.</p>
      <a href="/">Về trang chủ</a>
    </main>
  </body>
</html>
