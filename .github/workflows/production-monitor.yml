name: Production Monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-monitor.yml"
      - "scripts/lib/production-monitoring.mjs"
      - "scripts/production-monitor.mjs"
      - "scripts/production-monitoring.test.mjs"
      - "scripts/production-smoke.mjs"
      - "server/src/observability/metrics.js"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: production-monitor
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  read-only-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Run public production smoke
        run: npm run smoke:production
        env:
          ALLOW_REMOTE_PRODUCTION_SMOKE: "true"
          PRODUCTION_CLIENT_URL: https://htcoachingweb.io.vn
          PRODUCTION_API_URL: https://api.htcoachingweb.io.vn
      - name: Check protected metrics and integrity alerts
        if: always()
        run: npm run monitor:production
        env:
          ALLOW_REMOTE_PRODUCTION_MONITOR: "true"
          PRODUCTION_CLIENT_URL: https://htcoachingweb.io.vn
          PRODUCTION_API_URL: https://api.htcoachingweb.io.vn
          OPS_METRICS_TOKEN: ${{ secrets.PRODUCTION_OPS_METRICS_TOKEN }}
          PRODUCTION_MONITOR_OUTPUT: artifacts/production-monitor.json
      - name: Retain metrics and RUM snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: artifacts/production-monitor.json
          if-no-files-found: warn
          retention-days: 8
      - name: Open production alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Production monitor] Action required";
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );
            const failureMarker = "<!-- production-monitor-state:failure -->";
            const recoveredMarker = "<!-- production-monitor-state:recovered -->";
            const alertIssue = openIssues.find((issue) => issue.title === title);
            if (!alertIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body:
                  failureMarker +
                  "\nThe read-only production monitor failed. " +
                  "Review workflow run " +
                  context.serverUrl +
                  "/" +
                  context.repo.owner +
                  "/" +
                  context.repo.repo +
                  "/actions/runs/" +
                  context.runId +
                  " and follow docs/operations/runbooks/production-rollback-runbook.md.",
              });
              return;
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alertIssue.number,
                per_page: 100,
              },
            );
            const latestState = [...comments]
              .reverse()
              .map(({ body = "" }) =>
                body.includes(failureMarker)
                  ? "failure"
                  : body.includes(recoveredMarker)
                    ? "recovered"
                    : null,
              )
              .find(Boolean) ||
              (alertIssue.body?.includes(failureMarker) ? "failure" : null);
            if (latestState !== "failure") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alertIssue.number,
                body:
                  failureMarker +
                  "\nThe production monitor failed again in run " +
                  context.serverUrl +
                  "/" +
                  context.repo.owner +
                  "/" +
                  context.repo.repo +
                  "/actions/runs/" +
                  context.runId +
                  ".",
              });
            }
      - name: Record recovered production alert
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Production monitor] Action required";
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );
            const alertIssue = openIssues.find((issue) => issue.title === title);
            if (alertIssue) {
              const failureMarker = "<!-- production-monitor-state:failure -->";
              const recoveredMarker = "<!-- production-monitor-state:recovered -->";
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: alertIssue.number,
                  per_page: 100,
                },
              );
              const latestState = [...comments]
                .reverse()
                .map(({ body = "" }) =>
                  body.includes(failureMarker)
                    ? "failure"
                    : body.includes(recoveredMarker)
                      ? "recovered"
                      : null,
                )
                .find(Boolean) ||
                (alertIssue.body?.includes(failureMarker) ? "failure" : null);
              if (latestState !== "failure") return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: alertIssue.number,
                body:
                  recoveredMarker +
                  "\nThe production monitor recovered in run " +
                  context.serverUrl +
                  "/" +
                  context.repo.owner +
                  "/" +
                  context.repo.repo +
                  "/actions/runs/" +
                  context.runId +
                  ". Keep this incident open until owner review confirms the " +
                  "close criteria in docs/operations/runbooks/production-rollback-runbook.md.",
              });
            }
