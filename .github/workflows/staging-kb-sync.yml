name: Staging Knowledge Base Production Sync

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only preflight/apply for normal sync or review import
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - apply
          - review-preflight
          - review-apply
      release_sha:
        description: Exact commit currently deployed to staging
        required: true
      expected_plan_digest:
        description: Exact SHA-256 digest from the matching preflight (apply only)
        required: false

concurrency:
  group: staging-kb-production-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-live-acceptance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging

      - name: Verify exact staging release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$(git rev-parse HEAD)"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Validate apply input
        if: ${{ inputs.operation == 'apply' || inputs.operation == 'review-apply' }}
        shell: bash
        env:
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_PLAN_DIGEST" =~ ^[0-9a-f]{64}$ ]]

      - name: Run Knowledge Base sync
        working-directory: server
        shell: bash
        env:
          APP_ENV: staging
          MONGO_URI: ${{ secrets.STAGING_MONGO_URI }}
          MIGRATION_TARGET_DATABASE: htcoaching_staging
          PRODUCTION_KB_READONLY_URI: ${{ secrets.PRODUCTION_ACCOUNT_SYNC_READONLY_URI }}
          STAGING_KB_SYNC_REVIEWER_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_KB_SOURCE_ENV: production
          STAGING_KB_SOURCE_READ_ONLY: "yes"
          STAGING_KB_SYNC_EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          STAGING_KB_REVIEW_IMPORT_EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
          CONFIRM_STAGING_KB_SYNC: "yes"
          CONFIRM_STAGING_KB_REVIEW_IMPORT: "yes"
          KB_EMBEDDING_PROFILE: question-answering-v1
          CLIENT_URL: https://staging--htcoachingweb.netlify.app
          PUBLIC_API_ORIGIN: https://htcoachingweb-staging.onrender.com
          ALLOWED_ORIGINS: https://staging--htcoachingweb.netlify.app
          BACKGROUND_JOBS_ENABLED: "false"
          EMAIL_DELIVERY_MODE: disabled
          F1_RETENTION_ENFORCE: "false"
          RELEASE_SHA: ${{ inputs.release_sha }}
          OPERATION: ${{ inputs.operation }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest }}
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          if [[ "$OPERATION" == "preflight" ]]; then
            npm run --silent preflight:kb-sync:staging > ../artifacts/staging-kb-sync.json
          elif [[ "$OPERATION" == "apply" ]]; then
            npm run --silent sync:kb-sync:staging > ../artifacts/staging-kb-sync.json
          elif [[ "$OPERATION" == "review-preflight" ]]; then
            npm run --silent preflight:kb-review-import:staging > ../artifacts/staging-kb-sync.json
          else
            npm run --silent sync:kb-review-import:staging > ../artifacts/staging-kb-sync.json
          fi

      - name: Retain secret-free sync evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: staging-kb-sync-${{ github.run_id }}
          path: artifacts/staging-kb-sync.json
          if-no-files-found: error
          retention-days: 30

