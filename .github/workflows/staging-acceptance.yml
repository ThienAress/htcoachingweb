name: Staging Live Acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character Git SHA deployed to staging
        required: true
      ci_run_url:
        description: Successful CI Actions run URL for the same SHA
        required: true
      staging_client_deploy_id:
        description: Netlify staging deploy ID
        required: true
      staging_server_deploy_id:
        description: Render staging deploy ID
        required: true
      rollback_client_deploy_id:
        description: Known-good production Netlify deploy ID
        required: true
      rollback_server_deploy_id:
        description: Known-good production Render deploy ID
        required: true
      diagnostic_render_instances_shape:
        description: Stop after a sanitized read-only Render instances shape probe
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [staging-deployed]

concurrency:
  group: staging-live-acceptance
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging-live-acceptance
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.client_payload.release_sha }}
      CI_RUN_URL: ${{ inputs.ci_run_url || github.event.client_payload.ci_run_url }}
      STAGING_CLIENT_DEPLOY_ID: ${{ inputs.staging_client_deploy_id || github.event.client_payload.staging_client_deploy_id }}
      STAGING_SERVER_DEPLOY_ID: ${{ inputs.staging_server_deploy_id || github.event.client_payload.staging_server_deploy_id }}
      ROLLBACK_CLIENT_DEPLOY_ID: ${{ inputs.rollback_client_deploy_id || github.event.client_payload.rollback_client_deploy_id }}
      ROLLBACK_SERVER_DEPLOY_ID: ${{ inputs.rollback_server_deploy_id || github.event.client_payload.rollback_server_deploy_id }}
    steps:
      - name: Probe Render instances response shape (sanitized)
        if: ${{ inputs.diagnostic_render_instances_shape }}
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const knownEnvelopeFields = [
            "instances",
            "data",
            "items",
            "results",
            "value",
            "nodes",
            "edges",
            "serviceInstances",
          ];
          const knownPaginationFields = ["cursor", "nextCursor", "hasMore", "next"];
          const knownRecordFields = ["id", "createdAt", "updatedAt", "status", "serviceId"];
          const classify = (value) => value === null
            ? "null"
            : Array.isArray(value)
              ? "array"
              : typeof value;
          const recordMetadata = (value) => {
            const isObject = value !== null && typeof value === "object" && !Array.isArray(value);
            const keys = isObject ? Object.keys(value) : [];
            return {
              kind: classify(value),
              objectKeyCount: isObject ? keys.length : null,
              knownFields: Object.fromEntries(
                knownRecordFields.map((field) => [field, isObject && Object.hasOwn(value, field)]),
              ),
              unknownFieldCount: isObject
                ? keys.filter((field) => !knownRecordFields.includes(field)).length
                : null,
            };
          };

          try {
            const token = String(process.env.RENDER_API_KEY || "");
            const serviceId = String(process.env.RENDER_STAGING_SERVICE_ID || "");
            if (token.length < 20 || !/^[a-z0-9][a-z0-9._:-]{2,159}$/i.test(serviceId)) {
              throw new Error("invalid-probe-input");
            }
            const response = await fetch(
              `https://api.render.com/v1/services/${encodeURIComponent(serviceId)}/instances`,
              {
                method: "GET",
                headers: {
                  Accept: "application/json",
                  Authorization: `Bearer ${token}`,
                  "User-Agent": "htcoaching-release-gate-shape-probe/1.0",
                },
                signal: AbortSignal.timeout(30_000),
              },
            );
            let payload;
            let parsed = true;
            try {
              payload = await response.json();
            } catch {
              parsed = false;
            }
            const isObject = payload !== null && typeof payload === "object" && !Array.isArray(payload);
            const objectKeys = isObject ? Object.keys(payload) : [];
            const envelopeArrays = Object.fromEntries(
              knownEnvelopeFields.map((field) => {
                const candidate = isObject ? payload[field] : undefined;
                return [field, {
                  present: isObject && Object.hasOwn(payload, field),
                  isArray: Array.isArray(candidate),
                  length: Array.isArray(candidate) ? candidate.length : null,
                  firstRecord: recordMetadata(Array.isArray(candidate) ? candidate[0] : undefined),
                }];
              }),
            );
            const knownTopLevel = [...knownEnvelopeFields, ...knownPaginationFields, ...knownRecordFields];
            const metadata = {
              probe: "render-instances-shape-v1",
              status: response.status,
              jsonContentType: /^application\/json\b/i.test(response.headers.get("content-type") || ""),
              parsed,
              payloadKind: parsed ? classify(payload) : "unparsed",
              topLevelArrayLength: Array.isArray(payload) ? payload.length : null,
              topLevelFirstRecord: recordMetadata(Array.isArray(payload) ? payload[0] : undefined),
              topLevelObjectKeyCount: isObject ? objectKeys.length : null,
              knownTopLevelFields: Object.fromEntries(
                knownTopLevel.map((field) => [field, isObject && Object.hasOwn(payload, field)]),
              ),
              unknownTopLevelFieldCount: isObject
                ? objectKeys.filter((field) => !knownTopLevel.includes(field)).length
                : null,
              envelopeArrays,
            };
            const endTime = new Date();
            const startTime = new Date(endTime.getTime() - 60 * 60_000);
            const metricsUrl = new URL("https://api.render.com/v1/metrics/instance-count");
            metricsUrl.searchParams.set("startTime", startTime.toISOString());
            metricsUrl.searchParams.set("endTime", endTime.toISOString());
            metricsUrl.searchParams.set("resolutionSeconds", "60");
            metricsUrl.searchParams.set("resource", serviceId);
            const metricsResponse = await fetch(metricsUrl, {
              method: "GET",
              headers: {
                Accept: "application/json",
                Authorization: `Bearer ${token}`,
                "User-Agent": "htcoaching-release-gate-shape-probe/1.0",
              },
              signal: AbortSignal.timeout(30_000),
            });
            let metricsPayload;
            let metricsParsed = true;
            try {
              metricsPayload = await metricsResponse.json();
            } catch {
              metricsParsed = false;
            }
            const seriesMetadata = Array.isArray(metricsPayload)
              ? metricsPayload.slice(0, 10).map((series) => {
                const isSeries = series !== null && typeof series === "object" && !Array.isArray(series);
                const labels = isSeries && Array.isArray(series.labels) ? series.labels : [];
                const values = isSeries && Array.isArray(series.values) ? series.values : [];
                const numericValues = values
                  .filter((point) => point !== null && typeof point === "object"
                    && !Array.isArray(point) && Number.isFinite(point.value))
                  .map((point) => point.value);
                const latestPoint = values
                  .filter((point) => point !== null && typeof point === "object"
                    && !Array.isArray(point) && Number.isFinite(point.value)
                    && Number.isFinite(Date.parse(point.timestamp)))
                  .sort((left, right) => Date.parse(left.timestamp) - Date.parse(right.timestamp))
                  .at(-1);
                return {
                  kind: classify(series),
                  hasLabelsArray: isSeries && Array.isArray(series.labels),
                  labelCount: labels.length,
                  hasTargetResourceLabel: labels.some((label) => label !== null
                    && typeof label === "object" && !Array.isArray(label)
                    && ["resource", "service"].includes(label.field)
                    && label.value === serviceId),
                  hasValuesArray: isSeries && Array.isArray(series.values),
                  valueCount: values.length,
                  numericValueCount: numericValues.length,
                  minValue: numericValues.length ? Math.min(...numericValues) : null,
                  maxValue: numericValues.length ? Math.max(...numericValues) : null,
                  latestValue: latestPoint?.value ?? null,
                  latestAgeSeconds: latestPoint
                    ? Math.max(0, Math.round((endTime.getTime() - Date.parse(latestPoint.timestamp)) / 1000))
                    : null,
                  unitKind: series?.unit === "count" ? "count" : classify(series?.unit),
                };
              })
              : [];
            metadata.instanceCountMetrics = {
              status: metricsResponse.status,
              jsonContentType: /^application\/json\b/i.test(
                metricsResponse.headers.get("content-type") || "",
              ),
              parsed: metricsParsed,
              payloadKind: metricsParsed ? classify(metricsPayload) : "unparsed",
              seriesCount: Array.isArray(metricsPayload) ? metricsPayload.length : null,
              seriesMetadata,
            };
            const summarizeAdditionalMetric = async (url, { includeCounts = false } = {}) => {
              const metricResponse = await fetch(url, {
                method: "GET",
                headers: {
                  Accept: "application/json",
                  Authorization: `Bearer ${token}`,
                  "User-Agent": "htcoaching-release-gate-shape-probe/1.0",
                },
                signal: AbortSignal.timeout(30_000),
              });
              let metricPayload;
              let metricParsed = true;
              try {
                metricPayload = await metricResponse.json();
              } catch {
                metricParsed = false;
              }
              const series = Array.isArray(metricPayload) ? metricPayload : [];
              const labels = series.flatMap((item) => Array.isArray(item?.labels) ? item.labels : []);
              const points = series.flatMap((item) => Array.isArray(item?.values) ? item.values : []);
              const numericPoints = points.filter((point) => point !== null
                && typeof point === "object" && !Array.isArray(point)
                && Number.isFinite(point.value));
              const latestTimestamp = points
                .map((point) => Date.parse(point?.timestamp))
                .filter(Number.isFinite)
                .sort((left, right) => left - right)
                .at(-1);
              const instanceLabelValues = new Set(labels
                .filter((label) => label !== null && typeof label === "object"
                  && !Array.isArray(label) && label.field === "instance"
                  && typeof label.value === "string" && label.value)
                .map((label) => label.value));
              return {
                status: metricResponse.status,
                jsonContentType: /^application\/json\b/i.test(
                  metricResponse.headers.get("content-type") || "",
                ),
                parsed: metricParsed,
                payloadKind: metricParsed ? classify(metricPayload) : "unparsed",
                seriesCount: Array.isArray(metricPayload) ? metricPayload.length : null,
                seriesWithTargetService: series.filter((item) => Array.isArray(item?.labels)
                  && item.labels.some((label) => label !== null && typeof label === "object"
                    && !Array.isArray(label) && ["resource", "service"].includes(label.field)
                    && label.value === serviceId)).length,
                seriesWithInstanceLabel: series.filter((item) => Array.isArray(item?.labels)
                  && item.labels.some((label) => label?.field === "instance"
                    && typeof label.value === "string" && label.value)).length,
                distinctInstanceLabelCount: instanceLabelValues.size,
                pointCount: points.length,
                numericPointCount: numericPoints.length,
                latestAgeSeconds: Number.isFinite(latestTimestamp)
                  ? Math.max(0, Math.round((endTime.getTime() - latestTimestamp) / 1000))
                  : null,
                ...(includeCounts && numericPoints.length
                  ? {
                      minCount: Math.min(...numericPoints.map((point) => point.value)),
                      maxCount: Math.max(...numericPoints.map((point) => point.value)),
                      latestCount: numericPoints.at(-1).value,
                    }
                  : {}),
              };
            };
            const deprecatedServiceUrl = new URL(
              "https://api.render.com/v1/metrics/instance-count",
            );
            deprecatedServiceUrl.searchParams.set("service", serviceId);
            metadata.instanceCountMetricsDeprecatedService = await summarizeAdditionalMetric(
              deprecatedServiceUrl,
              { includeCounts: true },
            );
            const cpuUrl = new URL("https://api.render.com/v1/metrics/cpu");
            cpuUrl.searchParams.set("startTime", startTime.toISOString());
            cpuUrl.searchParams.set("endTime", endTime.toISOString());
            cpuUrl.searchParams.set("resolutionSeconds", "60");
            cpuUrl.searchParams.set("resource", serviceId);
            metadata.cpuMetrics = await summarizeAdditionalMetric(cpuUrl);
            process.stdout.write(`${JSON.stringify(metadata)}\n`);
          } catch {
            process.stderr.write('{"probe":"render-instances-shape-v1","probeError":true}\n');
          }
          process.exitCode = 1;
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify checked-out SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Verify CI identity
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || "")) throw new Error("Invalid RELEASE_SHA");
            const url = new URL(process.env.CI_RUN_URL);
            if (url.hostname !== "github.com") throw new Error("CI run must be on GitHub");
            if (!url.pathname.startsWith(`/${context.repo.owner}/${context.repo.repo}/actions/runs/`)) {
              throw new Error("CI run must belong to this repository");
            }
            const match = /\/actions\/runs\/(\d+)\/?$/.exec(url.pathname);
            if (!match) throw new Error("Invalid CI run URL");
            const { data } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(match[1]),
            });
            if (data.head_sha !== sha || data.conclusion !== "success") {
              throw new Error("CI run is not successful for RELEASE_SHA");
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: data.workflow_id,
            });
            if (workflow.path !== ".github/workflows/ci.yml") {
              throw new Error("CI run must come from the canonical CI workflow");
            }
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Verify exact Netlify and Render staging deploys
        run: npm run verify:staging-deploys
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_STAGING_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          DEPLOY_IDENTITY_OUTPUT: artifacts/staging-deploy-identity.json
          RENDER_TOPOLOGY_OUTPUT: artifacts/staging-render-topology.json
      - name: Run write-enabled staging acceptance with mandatory cleanup
        working-directory: server
        run: npm run acceptance:staging
        env:
          APP_ENV: staging
          MONGO_URI: ${{ secrets.STAGING_MONGO_URI }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          REFRESH_SECRET: ${{ secrets.STAGING_REFRESH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          CLIENT_URL: https://staging--htcoachingweb.netlify.app
          PUBLIC_API_ORIGIN: https://htcoachingweb-staging.onrender.com
          ALLOWED_ORIGINS: https://staging--htcoachingweb.netlify.app
          BACKGROUND_JOBS_ENABLED: "false"
          EMAIL_DELIVERY_MODE: disabled
          F1_RETENTION_ENFORCE: "false"
          CONFIRM_STAGING_ACCEPTANCE: "yes"
          STAGING_ACCEPTANCE_OUTPUT: ../artifacts/staging-acceptance.json
      - name: Install live AI browser runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run authenticated staging AI acceptance with verified cleanup
        working-directory: server
        run: npm run acceptance:staging:ai
        env:
          APP_ENV: staging
          MONGO_URI: ${{ secrets.STAGING_MONGO_URI }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          CLIENT_URL: https://staging--htcoachingweb.netlify.app
          PUBLIC_API_ORIGIN: https://htcoachingweb-staging.onrender.com
          ALLOWED_ORIGINS: https://staging--htcoachingweb.netlify.app
          BACKGROUND_JOBS_ENABLED: "false"
          EMAIL_DELIVERY_MODE: disabled
          F1_RETENTION_ENFORCE: "false"
          EXPECTED_KB_EMBEDDING_VERSION: gemini-embedding-2:768:question-answering-v1
          STAGING_RENDER_TOPOLOGY_EVIDENCE: ../artifacts/staging-render-topology.json
          RENDER_GIT_COMMIT: ${{ env.RELEASE_SHA }}
          STAGING_AI_ACCEPTANCE_ENABLED: "true"
          CONFIRM_STAGING_AI_ACCEPTANCE: "yes"
          STAGING_AI_ACCEPTANCE_OUTPUT: ../artifacts/staging-ai-acceptance.json
          STAGING_AI_ACCEPTANCE_RECOVERY_OUTPUT: ../artifacts/staging-ai-recovery-intent.json
      - name: Reverify deploy identity after live AI acceptance
        run: npm run verify:staging-deploys
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_STAGING_SITE_ID: ${{ secrets.NETLIFY_STAGING_SITE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_STAGING_SERVICE_ID: ${{ secrets.RENDER_STAGING_SERVICE_ID }}
          DEPLOY_IDENTITY_OUTPUT: artifacts/staging-deploy-identity-post-ai.json
          RENDER_TOPOLOGY_OUTPUT: artifacts/staging-render-topology-post-ai.json
      - name: Verify current release and off-device recovery evidence
        run: |
          npm run verify:backup-release
          npm run verify:disaster-recovery
      - name: Create exact release candidate manifest
        run: npm run create:release-candidate
        env:
          RELEASE_BRANCH: staging
          CI_STATUS: passed
          CI_SHA: ${{ env.RELEASE_SHA }}
          ACCEPTANCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACCEPTANCE_ARTIFACT_NAME: staging-acceptance-${{ github.run_id }}
          STAGING_ACCEPTANCE_EVIDENCE: artifacts/staging-acceptance.json
          STAGING_AI_ACCEPTANCE_EVIDENCE: artifacts/staging-ai-acceptance.json
          STAGING_DEPLOY_IDENTITY_EVIDENCE: artifacts/staging-deploy-identity.json
          STAGING_DEPLOY_IDENTITY_POST_AI_EVIDENCE: artifacts/staging-deploy-identity-post-ai.json
          STAGING_RENDER_TOPOLOGY_EVIDENCE: artifacts/staging-render-topology.json
          STAGING_RENDER_TOPOLOGY_POST_AI_EVIDENCE: artifacts/staging-render-topology-post-ai.json
          BACKUP_READINESS_MANIFEST: docs/operations/production/backup-readiness.json
          RELEASE_CANDIDATE_OUTPUT: artifacts/release-candidate.json
      - name: Retain per-release acceptance and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
