name: Recovery Readiness

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recovery-readiness.yml"
      - "docs/operations/production/backup-readiness.json"
      - "scripts/check-backup-readiness.mjs"
      - "scripts/lib/backup-readiness.mjs"

concurrency:
  group: recovery-readiness
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify-recovery-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Evaluate release and disaster-recovery gates
        id: readiness
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          npm run verify:backup-release > artifacts/backup-release.json
          release_exit=$?
          npm run verify:disaster-recovery > artifacts/disaster-recovery.json
          disaster_exit=$?
          set -e
          if [[ "$release_exit" -ne 0 || "$disaster_exit" -ne 0 ]]; then
            exit 1
          fi
      - name: Retain secret-free readiness reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovery-readiness-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Open recovery readiness incident
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Recovery readiness] Action required";
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              },
            );
            if (!openIssues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body:
                  "Production recovery evidence is stale or not independently recoverable. " +
                  "Review workflow run " +
                  context.serverUrl +
                  "/" +
                  context.repo.owner +
                  "/" +
                  context.repo.repo +
                  "/actions/runs/" +
                  context.runId +
                  " and follow docs/operations/runbooks/backup-restore-runbook.md. " +
                  "Keep this issue open until owner review confirms both readiness gates pass.",
              });
            }
