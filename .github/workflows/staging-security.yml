name: Staging Health and Security

on:
  push:
    branches: [staging]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Run the read-only monitor or recover exact AC-009 staging residue
        required: true
        type: choice
        default: monitor
        options:
          - monitor
          - recover-ai-residue
      recovery_acceptance_run_id:
        description: Failed Staging Live Acceptance workflow run ID
        required: false
        type: string
      recovery_release_sha:
        description: Exact incident SHA from the immutable recovery intent
        required: false
        type: string
      recovery_fixture_request_id:
        description: Optional exact Render application request ID for a legacy rejected fixture POST
        required: false
        type: string
      recovery_prior_run_id:
        description: Optional successful recovery bridge run ID for the same incident
        required: false
        type: string
      recovery_prior_run_attempt:
        description: Attempt number for recovery_prior_run_id
        required: false
        type: string
        default: "1"
      recovery_confirmation:
        description: Type RECOVER EXACT AC009 STAGING RESIDUE
        required: false
        type: string

concurrency:
  group: staging-health-security
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  read-only-monitor:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'monitor' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Check staging frontend and public APIs
        run: node scripts/staging-health.mjs
        env:
          ALLOW_REMOTE_STAGING_HEALTH: "true"
          STAGING_API_URL: https://htcoachingweb-staging.onrender.com
          STAGING_CLIENT_URL: https://staging--htcoachingweb.netlify.app
      - name: Run read-only staging security checks
        if: always()
        working-directory: server
        run: npm run security:smoke
        env:
          ALLOW_REMOTE_SECURITY_SMOKE: "true"
          SECURITY_SMOKE_BASE_URL: https://htcoachingweb-staging.onrender.com
          SECURITY_SMOKE_ALLOWED_ORIGIN: https://staging--htcoachingweb.netlify.app

  recover-ai-residue:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'recover-ai-residue' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/staging-ai-recovery.yml
    with:
      acceptance_run_id: ${{ inputs.recovery_acceptance_run_id }}
      release_sha: ${{ inputs.recovery_release_sha }}
      fixture_request_id: ${{ inputs.recovery_fixture_request_id }}
      prior_recovery_run_id: ${{ inputs.recovery_prior_run_id }}
      prior_recovery_run_attempt: ${{ inputs.recovery_prior_run_attempt }}
      confirmation: ${{ inputs.recovery_confirmation }}
    secrets: inherit
