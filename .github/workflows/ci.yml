name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: node ../scripts/check-dependency-audit.mjs client
        working-directory: client
      - run: npm run test:ui-audit
      - run: npm run ui:audit -- --baseline scripts/ui-audit/baseline.json --fail-on-new-high
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          SKIP_DYNAMIC_ROUTES: "true"
          VITE_API_URL: "https://example.invalid/api"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-dist-static-non-production
          path: client/dist
          retention-days: 3

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: node ../scripts/check-dependency-audit.mjs server
        working-directory: server
      - run: npm run check:runtime-logging
        working-directory: server
      - run: npm run test:ai-eval
      - run: npm test
        working-directory: server

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm run check:commercial-contracts
      - run: node scripts/check-secrets.mjs
      - run: node scripts/check-repository-boundaries.mjs
      - run: npm run security:docs-privacy
      - run: npm run test:agents:governance
      - run: npm run test:search-quality
      - run: npm run search:benchmark
      - run: npm run test:agent-harness:p2
      - run: npm run context:build -- --plan 078
      - run: npm run search:pilot
      - run: npm run agents:validate
      - run: npm run test:ops

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        if: github.event_name != 'schedule'
      - run: npx playwright install --with-deps chromium firefox webkit
        if: github.event_name == 'schedule'
      - run: npm run test:e2e
        env:
          PW_FULL_BROWSER_MATRIX: ${{ github.event_name == 'schedule' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_IMAGE: htcoaching-api:ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Docker contracts
        run: npm run test:docker-contract
      - name: Lint backend Dockerfile
        run: |
          docker run --rm --interactive \
            hadolint/hadolint@sha256:158cd0184dcaa18bd8ec20b61f4c1cabdf8b32a592d062f57bdcb8e4c1d312e2 \
            hadolint --failure-threshold warning --no-color - < server/Dockerfile
      - name: Validate local Compose model
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --platform linux/amd64 --file server/Dockerfile --tag "$API_IMAGE" .
      - name: Start API and Mongo smoke stack
        run: HTCOACHING_API_IMAGE="$API_IMAGE" docker compose up --detach --no-build --wait
      - name: Verify live and ready endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5000/api/ops/health/live
          curl --fail --silent --show-error http://127.0.0.1:5000/api/ops/health/ready
      - name: Export backend image for socket-free scanning
        run: docker save "$API_IMAGE" --output htcoaching-api.tar
      - name: Report high and critical image vulnerabilities
        run: |
          mkdir -p "${{ runner.temp }}/trivy-cache"
          docker run --rm \
            --volume "${{ github.workspace }}/htcoaching-api.tar:/workspace/htcoaching-api.tar:ro" \
            --volume "${{ runner.temp }}/trivy-cache:/root/.cache" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /workspace/htcoaching-api.tar --scanners vuln \
            --severity HIGH,CRITICAL --exit-code 0 --no-progress
      - name: Reject fixable critical image vulnerabilities
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/htcoaching-api.tar:/workspace/htcoaching-api.tar:ro" \
            --volume "${{ runner.temp }}/trivy-cache:/root/.cache" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --input /workspace/htcoaching-api.tar --scanners vuln \
            --ignore-unfixed --severity CRITICAL --exit-code 1 --no-progress
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop smoke stack
        if: always()
        run: docker compose down --volumes --remove-orphans
